# CriteriaBank pretraining of VFM-4B (w/o KL) from Qwen/Qwen3-4B.
# One epoch, effective batch 128 = 4 per GPU x 8 accumulation x 4 GPUs (torchrun).
# The head starts from the unembedding rows of " Yes", "No", " Unknown" with
# mean-centered bias. Saves every 1,000 steps.
init_from_base: Qwen/Qwen3-4B
train: data/criteriabank/train.jsonl
output_dir: runs/pretrain_nokl_4b
seed: 42
head_learning_rate: 5.0e-4
backbone_learning_rate: 5.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
max_grad_norm: 1.0
num_train_epochs: 1
early_stopping_patience: 0
eval_steps: 1000
save_total_limit: 2
per_device_batch_size: 4
gradient_accumulation_steps: 8
max_length: 4096
kl_lambda: 0.0
