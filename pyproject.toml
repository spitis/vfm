[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vfm"
version = "1.0.0"
description = "Runtime verification of many natural-language criteria in one forward pass (VFM)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# Tested: torch 2.10; transformers 4.57.1, 4.57.6 and 5.20.2.
dependencies = [
    "torch>=2.4",
    "transformers>=4.57.1,<6",
    "numpy>=1.24",
    "tqdm",
]

[project.optional-dependencies]
train = ["accelerate>=1.0", "pyyaml>=6.0"]
benchmarks = ["datasets>=3.0", "nltk>=3.8", "langdetect>=1.0.9"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
